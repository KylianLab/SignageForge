# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Sessions are kept inside the project with their own cookie name, so
    # another PHP application on the same server (or the same host name) can
    # never read or overwrite Signage Forge sessions.
    session:
        handler_id: session.handler.native_file
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'
        name: signageforge_session
        cookie_samesite: lax
        cookie_secure: auto

    # Signage Forge usually sits behind the institution's reverse proxy.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        # Tests never call GitHub.
        http_client:
            mock_response_factory: App\Tests\Double\FakeInternet
        session:
            storage_factory_id: session.storage.factory.mock_file
