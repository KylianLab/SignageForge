security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # Sign-in methods; each one only runs when enabled (App\Security\AuthProviders).
            custom_authenticators:
                - App\Security\LocalLoginAuthenticator
                - App\Security\LdapLoginAuthenticator
                - App\Security\MicrosoftAuthenticator
            entry_point: App\Security\LocalLoginAuthenticator
            logout:
                path: app_logout
                target: app_login

    # Screens have no login: pairing, the player and media bytes stay public.
    # Only the first matching rule applies.
    access_control:
        - { path: ^/dashboard, roles: ROLE_VIEWER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
