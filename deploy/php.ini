; PHP settings for Signage Forge. Copy into your PHP configuration (conf.d) on a
; classic install; the Containerfile does it for you.

; Largest media file you want to accept (videos can be big).
upload_max_filesize = 512M
post_max_size = 520M
max_execution_time = 120
memory_limit = 256M

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
