# nginx + PHP-FPM server block for Signage Forge.
server {
    listen 443 ssl;
    server_name signage.example.org;
    root /srv/signageforge/public;

    ssl_certificate     /etc/pki/tls/certs/signage.example.org.crt;
    ssl_certificate_key /etc/pki/tls/private/signage.example.org.key;

    # Match upload_max_filesize / post_max_size in deploy/php.ini.
    client_max_body_size 520m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Only with SIGNAGEFORGE_REALTIME=mercure. Buffering must be off, or screens
    # only receive updates when the buffer fills.
    # location /.well-known/mercure {
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_http_version 1.1;
    #     proxy_buffering off;
    #     proxy_read_timeout 24h;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
