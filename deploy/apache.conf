# Apache + PHP-FPM virtual host for Signage Forge.
# Adjust ServerName, paths and the PHP-FPM socket (RHEL: /run/php-fpm/www.sock,
# Debian: /run/php/php8.3-fpm.sock).
<VirtualHost *:443>
    ServerName signage.example.org
    DocumentRoot /srv/signageforge/public

    SSLEngine on
    SSLCertificateFile    /etc/pki/tls/certs/signage.example.org.crt
    SSLCertificateKeyFile /etc/pki/tls/private/signage.example.org.key

    <Directory /srv/signageforge/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php-fpm/www.sock|fcgi://localhost"
    </FilesMatch>

    <Files "sw.js">
        Header set Cache-Control "no-cache"
    </Files>

    # Only with SIGNAGEFORGE_REALTIME=mercure: forward the hub, without buffering.
    # ProxyPass        /.well-known/mercure http://127.0.0.1:3000/.well-known/mercure flushpackets=on
    # ProxyPassReverse /.well-known/mercure http://127.0.0.1:3000/.well-known/mercure

    ErrorLog  /var/log/httpd/signageforge_error.log
    CustomLog /var/log/httpd/signageforge_access.log combined
</VirtualHost>
