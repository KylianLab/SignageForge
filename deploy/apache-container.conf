<VirtualHost *:80>
    DocumentRoot /srv/signageforge/public
    <Directory /srv/signageforge/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    # Let the player's service worker control the whole site.
    <Files "sw.js">
        Header set Service-Worker-Allowed "/"
        Header set Cache-Control "no-cache"
    </Files>
</VirtualHost>
